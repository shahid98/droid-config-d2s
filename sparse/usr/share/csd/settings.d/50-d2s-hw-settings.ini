# Hardware feature declarations for d2s (Samsung Galaxy Note 10+, SM-N975F).
#
# WHY THIS FILE EXISTS
# --------------------
# ssu-sysinfo answers "does this device have feature X?" from
#   /usr/share/csd/settings.d/*hw-settings*.ini    section [features]
# and in hw_feature_get_fallback() ONLY Suspend and Reboot default to true -
# every other feature is false unless it is declared here.
#
# sensorfw gates each sensor on those answers. /etc/sensorfw/sensord.conf.d/
# 20-sensors-default.conf contains:
#     accelerometersensor=Feature_AccelerationSensor
#     alssensor=Feature_LightSensor
#     compasssensor=Feature_CompassSensor
#     gyroscopesensor=Feature_GyroSensor
#     orientationsensor=Feature_GyroSensor|Feature_AccelerationSensor
#     proximitysensor=Feature_ProximitySensor
#
# With no file here, `ssu-sysinfo -f` printed exactly two lines
# (Feature_Suspend, Feature_Reboot), so every sensor was marked unavailable
# and sensorfwd logged "Plugin not available: orientationsensor" etc. - even
# though all the libhybris*adaptor plugins were installed and working. That in
# turn is why lipstick logged "Could not start the orientation sensor" and
# auto-rotation never worked.
#
# Keys are the CSD names from hw_feature_to_csd_key(), NOT the Feature_* enum
# names. Value is numeric: non-zero means present.

[features]

# --- Sensors -----------------------------------------------------------
GSensor=1                 # Feature_AccelerationSensor
Gyro=1                    # Feature_GyroSensor
ECompass=1                # Feature_CompassSensor  (geomagnetic)
LightSensor=1             # Feature_LightSensor    (RGB ambient light)
ProxSensor=1              # Feature_ProximitySensor
Hall=1                    # Feature_CoverSensor    (Clear View cover)
Fingerprint=1             # Feature_FingerprintSensor (ultrasonic, in-display)

# --- Radios ------------------------------------------------------------
Bluetooth=1
Wifi=1
GPS=1
CellularData=1
CellularVoice=1
CellInfo=1
SIM=1
FmRadio=0                 # N975F ships without an FM receiver

# --- Display / input ---------------------------------------------------
LCD=1
Backlight=1
Touch=1
Key=1                     # power, volume, Bixby
TouchAuto=0               # no touchscreen self-test support
ButtonBacklight=0         # no capacitive buttons
LED=0                     # Note 10+ has no notification LED

# --- Audio -------------------------------------------------------------
Loudspeaker=1
StereoLoudspeaker=1       # AKG-tuned stereo pair
Receiver=1                # Feature_AudioPlayback (earpiece)
AudioMic1=1
AudioMic2=1
Headset=0                 # the Note 10 series dropped the 3.5mm jack; there
                          # is no h2w switch, which is also why PulseAudio
                          # logs "could not start input device detection"

# --- Cameras -----------------------------------------------------------
BackCamera=1
BackCameraFlash=1
FrontCamera=1
FrontCameraFlash=0        # front "flash" is a screen effect, not hardware

# --- Power / storage / USB ---------------------------------------------
Battery=1
UsbCharging=1
UsbOtg=1
SDCard=1                  # microSD slot in the hybrid tray
Vibrator=1

# --- Not applicable ----------------------------------------------------
TOH=0                     # Jolla 1 "The Other Half" accessory
