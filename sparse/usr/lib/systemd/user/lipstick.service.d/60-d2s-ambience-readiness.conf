[Unit]
# ambienced already orders itself before Lipstick; make it a hard dependency
# too so a failed ambience daemon cannot race the home screen.
Requires=ambienced.service
After=ambienced.service
# A USER -> ACT_DEAD transition must not leave the normal home compositor
# restarting underneath the charging-only UI.
Conflicts=jolla-actdead-charging.service

[Service]
# A hard power-off can leave correctly-sized but zero-filled cached images.
# Remove those disposable entries before QML tries to load them.
ExecStartPre=/usr/bin/d2s-thumbnail-cache-repair.py
