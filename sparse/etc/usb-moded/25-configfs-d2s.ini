# usb-moded's ConfigFS defaults were written for the Sony XA2 port and do not
# match Samsung's Android gadget:
#
#   expected                      actual on d2s
#   configs/b.1                   configs/c.1
#   rndis_bam.rndis               rndis.usb0
#
# Every mode switch that reconfigures the gadget therefore failed with
#   usb_moded: /config/usb_gadget/g1/configs/b.1: opendir failed
# and usb-moded fell back to "undefined", unbinding the UDC - so selecting
# "Charging only" killed USB outright, and mtp_mode never reconfigured the
# gadget at all (it stayed on rndis and never enumerated as 0a07).
#
# developer_mode was unaffected only because its dyn-mode drives the legacy
# /sys/class/android_usb compat interface rather than ConfigFS.
[configfs]
gadget_conf_directory = configs/c.1
function_rndis = rndis.usb0
function_mtp = ffs.mtp
