# Let the user choose what USB does, instead of forcing developer mode.
#
# patterns-sailfish-rnd pulls in jolla-rnd-device, which ships
# /etc/usb-moded/70-use-developer-mode.ini containing:
#
#     [usbmode]
#     mode=developer_mode
#
# That is right for an R&D handset and wrong for anyone else: it pins the
# gadget to RNDIS for good. Settings still shows the USB options and still
# stores the choice - /var/lib/usb-moded/usb-moded.ini correctly read
# mode=mtp_mode here - but the gadget never changes, so "always ask" never
# asks and MTP never appears. On the host the phone stays 18d1:0a02 with only
# RNDIS Control and RNDIS Ethernet Data interfaces, whatever is selected.
#
# usb-moded merges /etc/usb-moded/*.ini in name order and the last value wins,
# so a file sorting after 70- undoes the pin without touching a file another
# package owns (deleting or replacing that one would be an rpm conflict, and
# an upgrade would put it straight back). Verified on the device: with this
# file in place the gadget left developer mode and re-enumerated as 18d1:0afe;
# with it removed it went back.
#
# "ask" rather than a fixed mode, because that is the stock Sailfish default
# and it puts the decision where it belongs. Note the consequence for remote
# work: a freshly flashed device now comes up asking rather than in developer
# mode, so USB networking needs picking once from Settings -> USB before
# telnet/ssh over the cable is available.
[usbmode]
mode=ask
