# Give the journal room to hold more than a couple of minutes.
#
# Sailfish ships Storage=volatile with RuntimeMaxUse=1M, so the whole journal
# lives in /run (tmpfs) inside 1 MB. On this port that is about 110 seconds of
# history: long enough that `journalctl -b` for anything that happened at boot
# returns "Journal has been rotated since unit was started" by the time anyone
# looks. Diagnosing a boot problem then means reproducing it and racing the
# rotation, which is exactly the position this port was in while the clean
# flash was being debugged.
#
# Kept volatile deliberately: persistent journals write to flash continuously,
# and this is a phone. 64 MB of a 12 GB device is nothing, and the tmpfs only
# grows to what is actually stored.
#
# At the sensor-hub log rate this port currently produces (~140 lines/s, see
# d2s-proximity-uinput.py) that is roughly an hour and a half; once that spam
# is gone it is most of a day. The larger per-file size just means rotating
# 8 MB files rather than 512 KB ones.
[Journal]
RuntimeMaxUse=64M
RuntimeMaxFileSize=8M
