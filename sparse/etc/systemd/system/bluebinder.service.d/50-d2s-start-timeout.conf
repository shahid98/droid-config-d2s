# The first bluebinder instance after a cold boot never finishes starting: it
# reaches "Turning bluetooth on" and then hangs in the vendor HAL, so systemd
# waits out TimeoutStartSec before killing it. See d2s-bluebinder-restart.service
# for why that instance is doomed regardless of how long it is given.
#
# Upstream's timeout is 60 s, and that whole minute lands in the boot path:
# bluebinder is Before=bluetooth.service, and the user session (so lipstick)
# waits for network.target behind it. Measured on d2s: bluebinder started at
# 11.5 s, timed out at 71.7 s, lipstick appeared at 72.5 s.
#
# 10 s is well past a healthy start (the working instance takes ~1.7 s) and
# turns that minute into ten seconds. Bluetooth itself is unaffected - it is
# the restart afterwards that makes the adapter usable.

[Service]
TimeoutStartSec=10
