# Keep telephony self-healing on d2s.
#
# Two failure modes seen on 2026-09-12, both of which left the phone with no
# telephony at all until someone intervened:
#
# 1. ofono SEGVs during SIM initialisation, right after
#      SIM card OK
#      Requested file structure differs from SIM: 6fb7
#      Open logical channel failure: MISSING_RESOURCE
#    Stock ofono.service has systemd's default start-rate limit, so a few
#    crashes in quick succession end with "Start request repeated too quickly"
#    and the unit sits in "failed" forever - no calls, no SMS, no coverage,
#    and nothing retries. StartLimitIntervalSec=0 disables that cap so ofono
#    always comes back.
#
# 2. The crash itself wedged the phone for minutes. /proc/sys/kernel/core_pattern
#    pipes cores to Sailfish's rich-core-dumper, and dumping ofono's ~14 threads
#    took so long that the process sat in do_coredump (main thread) with every
#    other thread in D state at exit_mm. systemd still reported the unit
#    "active" (the process had not finished exiting), so it never restarted it,
#    while every D-Bus call to org.ofono timed out - which looks exactly like a
#    hang, not a crash. LimitCORE skips the core for ofono only, turning a
#    multi-minute wedge into an immediate restart. Other services keep their
#    rich cores.
#
#    It must be LimitCORE=1, NOT 0. core_pattern here is a pipe to
#    rich-core-dumper, and for a pipe the kernel ignores RLIMIT_CORE entirely -
#    nothing is written to the filesystem, so the size limit is meaningless.
#    Only the value 1 is special-cased (the kernel uses it to catch recursive
#    crashes) and skips the dump. Measured by sending SIGSEGV to ofonod:
#    with limit 0 it stayed in do_coredump for 24 s+, with limit 1 it was gone
#    in under 2 s.
#
# Neither of these fixes the SEGV; they stop one crash from taking telephony
# down permanently. Remove LimitCORE=0 if you need a core to debug the crash.

[Unit]
StartLimitIntervalSec=0

[Service]
LimitCORE=1
Restart=always
RestartSec=3
