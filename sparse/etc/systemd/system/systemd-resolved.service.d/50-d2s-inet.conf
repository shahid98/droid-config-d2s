# The Android kernel is built with CONFIG_ANDROID_PARANOID_NETWORK: only
# members of AID_INET (gid 3003, "inet") may create AF_INET/AF_INET6 sockets.
# resolved runs as systemd-resolve, which is not in it, so every upstream query
# failed with socket() = EACCES and every lookup through the 127.0.0.53 stub
# timed out ("All attempts to contact name servers or networks failed").
[Service]
SupplementaryGroups=inet
