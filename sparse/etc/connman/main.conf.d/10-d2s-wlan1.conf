# bcmdhd registers two station interfaces on d2s: wlan0 (the real one) and
# wlan1, a spare that stays dormant. connman manages both, each scans, and
# every access point is then listed twice in Settings - once as
# wifi_<wlan0-mac>_<ssid>_managed_psk and once as wifi_<wlan1-mac>_...
# (100 services for a handful of networks). p2p0 is already covered by the
# "p2p" entry in the stock blacklist; wlan1 is not, so add it here.
#
# Keep the stock entries - this list replaces the one in main.conf.
[General]
NetworkInterfaceBlacklist = ifb,p2p,usb,rmnet,rev_rmnet,wlan1
