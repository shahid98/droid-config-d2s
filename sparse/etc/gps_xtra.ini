# Assistance data for the Broadcom BCM47765 GNSS chip (read by
# geoclue-provider-hybris; keys are XTRA_SERVER_0..2).
#
# Broadcom's gpsd is configured to fetch its long-term orbit data (LTO) itself
# (HttpSyncLto in /vendor/etc/gnss/gps.xml), but Android processes cannot
# resolve host names on Sailfish - netd has no default network - so it never
# got any, and every start was a cold one. The HAL also asks the framework to
# download that data (IGnssXtraCallback::downloadRequestCb); with servers
# listed here the provider fetches it over Sailfish's own network stack and
# injects it. These are the public 7-day LTO files; v5 carries GPS, GLONASS,
# BeiDou and Galileo, v2 is the older GPS/GLONASS format as a fallback.
[xtra]
XTRA_SERVER_0=https://gllto.glpals.com/7day/v5/latest/lto2.dat
XTRA_SERVER_1=https://gllto.glpals.com/7day/v2/latest/lto2.dat
