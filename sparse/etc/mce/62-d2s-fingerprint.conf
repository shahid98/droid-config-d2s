# Let the fingerprint sensor unlock the phone.
#
# mce ships with the fingerprint wakeup policy set to "never", so even with a
# working fpd and an enrolled finger the lock screen never asks the daemon to
# identify anything: touching the sensor does nothing at all, with no hint as to
# why. mce's own key for it, as written by
#     mcetool --set-fingerprint-wakeup-mode=always
# is below. These files are read as builtin-gconf overrides, so the value is the
# enum rather than the name: 0 = never, 1 = always, 2 = proximity.
#
# "always" rather than "proximity" because the proximity policy suppresses
# wakeups while the sensor is covered, and this phone's proximity sensor needs
# the uinput bridge (see d2s-proximity-uinput.service) - one more thing to go
# wrong between a finger and an unlock.
/system/osso/dsm/fingerprint/mode=1
