# Stop mce treating the idle wireless-charging coil as a charger.
#
# Unplugging USB left the charging bolt lit in the status bar forever. The
# kernel was right and mce was wrong. Logged across an unplug:
#
#   kernel:  batt=Full  usb=1  ->  batt=Discharging  usb=0   (immediately)
#   mce:     charger_state ('on',)  ->  ('on',)               (never changed)
#
# and mce said why itself:
#
#   modules/battery-udev.c: mcebat_update(): charger_type: usb -> wireless
#
# When USB goes away mce does not conclude "no charger", it picks the wireless
# supply instead and keeps charger_state on. That supply is present on d2s
# whether or not anything is on the pad:
#
#   /sys/class/power_supply/wireless/uevent
#       POWER_SUPPLY_NAME=wireless
#       POWER_SUPPLY_ONLINE=0
#       POWER_SUPPLY_PRESENT=1
#
# battery-udev decides a charger is active from both properties (it logs
# "charger @ present=%d online=%d -> active=%d"), so a coil that is merely
# fitted reads as a charger that is connected.
#
# Blacklisting the device is the narrow fix: ac, usb, otg and ps all report
# ONLINE honestly, so with wireless out of the list mce sees no active charger
# once the cable is out.
#
# Cost: mce can no longer notice Qi charging, so the bolt will not appear when
# the phone is on a wireless pad. Charging still works - this only affects the
# indicator - and a bolt that is always on is worse than one that misses a
# case this port has never verified anyway.
[BatteryUDevDeviceBlacklist]
# Defining this group replaces mce's built-in list, so retain those entries.
bcl=true
bms=true
dc=true
fg_adc=true
main=true
parallel=true
pc_port=true
pm8921-dc=true

# The d2s wireless coil reports PRESENT=1 even when it is not charging.
wireless=true
